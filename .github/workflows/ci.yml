name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # uv.lock was generated by this version. Unpinned latest rejects it under --locked.
          version: "0.13.6"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Python dependencies
        run: uv sync --extra dev --extra knowledge --locked
      - name: Install dbmate
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/dbmate" \
            https://github.com/amacneil/dbmate/releases/download/v2.37.0/dbmate-linux-amd64
          chmod +x "${RUNNER_TEMP}/dbmate"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Run isolated Python tests
        run: uv run pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build
